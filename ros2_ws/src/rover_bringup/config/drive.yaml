# drive_bridge settings (Pi -> ESP32 drivetrain). See docs/06_drivetrain_link.md
# Change live: ros2 param set /drive_bridge max_linear_mps 0.6
drive_bridge:
  ros__parameters:
    port: "auto"                 # or e.g. /dev/serial/by-id/usb-Silicon_Labs_CP2102_..._0001-if00-port0
    baud: 115200
    # Speed of the rover at FULL power. Measure these (doc 06, "Calibrate").
    # Nov 13 first arena laps: asked 0.18 m/s, went ~0.57 m/s; asked 1.0 rad/s turns, went ~1.9 rad/s.
    max_linear_mps: 1.6          # forward m/s at 100%      (from the Nov 13 lap log)
    max_strafe_mps: 1.2          # sideways m/s at 100%     (GUESS: ~75% of forward, not measured)
    max_angular_radps: 5.0       # spin rad/s at 100%       (from the Nov 13 lap log, rough)
    send_rate_hz: 20.0           # commands per second to the ESP32
    cmd_timeout_s: 0.5           # /cmd_vel older than this -> send stop
    enable_from_controller: true # Y on the controller (ESP32 AUTO mode) starts the autonomy
    echo_esp32_log: true         # print the ESP32's debug lines in this terminal
