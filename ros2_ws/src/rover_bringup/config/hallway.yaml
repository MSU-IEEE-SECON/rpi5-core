# hallway_follower settings. Edit, then on the Pi:
#   cd ~/repos/rpi5-core/ros2_ws && colcon build --symlink-install && source install/setup.bash
# Or change live while it runs:  ros2 param set /hallway_follower cruise_speed 0.2
# Keep decimals on decimal values (write 1.0 not 1) or ROS rejects the type.
#
# These match the values tested in test/sim_drive.py. Start slow on the real rover.
hallway_follower:
  ros__parameters:
    cruise_speed: 0.15              # m/s, normal forward speed
    slow_speed: 0.06                # m/s, speed just before stop_dist
    max_turn: 0.6                   # rad/s, angular speed limit
    kp_heading: 1.0                 # (rad/s) per rad of heading error to the target
    pivot_turn: 0.5                 # rad/s, turn-in-place speed when stopped by an obstacle
    robot_half_width: 0.13          # m, half the rover's width (10 in wide rover)
    side_margin: 0.08               # m, extra clearance each side
    lookahead: 1.0                  # m, how far ahead obstacles are considered
    steer_lookahead: 0.8            # m, aim point distance (bigger = gentler steering)
    slow_dist: 0.8                  # m, start slowing for things in the path
    stop_dist: 0.3                  # m, stop forward motion inside this
    max_wall_dist: 3.0              # m, side readings beyond this = "no wall" (fits a wide hallway)
    wall_fit_x: 2.0                 # m, |x| window of points used to find the walls
    wall_tol: 0.04                  # m, how far a point can be from a wall line and count
    min_wall_span: 0.6              # m, a "wall" must be at least this long
    ransac_iters: 60                # line-fit attempts per side per scan
    behind_x: 0.2                   # m, things this far behind the LiDAR still count as "beside"
    obstacle_band: 0.5              # m, obstacles within this of the nearest one are grouped
    side_stop: 0.05                 # m, won't turn toward a side closer than robot_half_width + this
    stick_bonus: 0.15               # m, preference for keeping the previously chosen side
    width_bonus: 0.6                # preference for wider gaps (score -= this * gap width)
    min_range: 0.12                 # m, ignore returns closer than this to the LiDAR (C1 is unreliable <0.1 m; closer = our own rover)
    wall_margin: 0.1                # m, points within this of a wall line count as wall, not obstacle
    clear_scans_reset: 5            # scans with nothing between the walls before forgetting the chosen side
    hit_margin: 0.05                # m, clearance beyond robot_half_width that counts as "would hit"
    max_hall_yaw_deg: 40.0          # deg, never angle more than this across the hallway
    laser_x: 0.0                    # m, LiDAR position from the rover's centre: + = forward of centre
    laser_y: 0.0                    # m, LiDAR position from the rover's centre: + = LEFT of centre, - = right
    fov_deg: 180.0                  # deg, use points within +-fov/2 of ahead (rear blocked by mount)
    fov_left_deg: -1.0              # deg usable left of ahead (-1 = fov_deg/2). calibrate_lidar sets this
    fov_right_deg: -1.0             # deg usable right of ahead (-1 = fov_deg/2)
    # --- the rover's own body (Nov 9: wheels beside the front-mounted LiDAR showed up at
    #     +-90 deg, 13-20 cm, and read as 'something in my path' -> always BLOCKED) ---
    body_front: 0.07                # m, how far the rover sticks out in front of the LiDAR (front-right wheel showed at -66 deg, 12 cm)
    body_half_width: 0.22           # m, half the rover's full width incl. wheels (+ a little)
    # --- MODE ---
    avoid_obstacles: false          # false = hallway mode: stay centred, drive down the hall, STOP for anything ahead
                                    # true  = also steer around obstacles (the original behaviour)
    # --- remembering which way the hallway goes (so turning can't confuse it) ---
    hall_gate_deg: 15.0             # deg, wall readings this far off the expected direction are doubted
    hall_gain: 0.5                  # 0..1, how much each new wall reading corrects the remembered direction
    hall_relock_scans: 4            # doubted readings in a row before believing them anyway
    coast_scans: 3                  # sparse scans in a row to coast through before stopping
    # --- smoothing (added Nov 6 for the "drunk driver" wiggle) ---
    turn_smoothing: 0.35            # 0..1, how fast steering follows a new decision (1.0 = instant, old behaviour)
    heading_deadband_deg: 2.0       # deg, ignore heading errors smaller than this (stops micro-wiggle)
    accel: 0.3                      # m/s^2, max speed-up rate (braking is always instant)
    scan_dt: 0.1                    # s, time between scans (C1 = 10 Hz)
    stop_release: 0.1               # m, once stopped, path must clear stop_dist by this much to go again
    min_obstacle_pts: 3             # ignore lone single-point returns (1 = off)
    # --- self mask: the rover's own body in the scan (record_self_mask) ---
    self_mask_file: "~/rover_data/self_mask.json"
    self_mask_margin: 0.03          # m, extra beyond the recorded body
    # NOTE: if ~/rover_data/lidar_calib.json exists on the Pi (rover.sh calibrate), it overrides
    # laser_yaw, laser_mirror, fov_left_deg and fov_right_deg below.
    # LiDAR direction fix. Nov 8 hand test on the new mount: a hand in FRONT read as 'back'
    # (~180 deg) while a hand on the RIGHT read as 'right' (-90): the scan is mirrored
    # front-to-back. Rover angle = laser_yaw - raw angle when laser_mirror is true.
    laser_yaw: 3.14159              # rad
    laser_mirror: true              # true = flip the scan direction (then rotate by laser_yaw)
    scan_timeout_s: 0.5             # stop if no LiDAR data for this long
    start_enabled: false            # true = drive as soon as it starts (not recommended)
    log_period_s: 0.5               # status line rate in the terminal
